version: '3.8'

services:
  backend:
    build: .
    container_name: privagent-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - LLM_PROVIDER=mock
      - LOG_LEVEL=INFO
    volumes:
      - ./demo:/app/demo:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
