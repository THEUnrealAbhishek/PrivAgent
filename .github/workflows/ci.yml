name: PrivAgent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Extension JS Tests
        run: |
          node tests/test_extension.js

      - name: Validate Manifest V3 JSON
        run: |
          python -c "
          import json
          with open('extension/manifest.json', 'r') as f:
              m = json.load(f)
          assert m['manifest_version'] == 3, 'Must be Manifest V3'
          assert 'permissions' in m
          print('Manifest V3 JSON validation passed.')
          "
